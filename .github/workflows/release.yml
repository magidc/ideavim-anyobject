name: Gradle Build & Auto Release

on:
  push:
    branches:
      - release
      - beta

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout with full history so we can tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setting up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Extract Gradle version
        id: get_version
        run: |
          VERSION=$(./gradlew properties -q | grep "^pluginVersion:" | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT 

      - name: Build with Gradle
        run: ./gradlew buildPlugin

      - name: Extract release notes
        id: extract-notes
        run: |
          # Find the first version header and extract until the next version header
          RELEASE_NOTES=$(awk '/^## [0-9]/ {if(found) exit; found=1; next} found' CHANGELOG.md)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  stable-release:
      if: github.ref == 'refs/heads/release'
      runs-on: ubuntu-latest
      permissions:
        contents: write
        pull-requests: write
        checks: write

      steps:
        - name: Create Git tag  (only if not existing)
          run: |
            tag_name: ${{ format('{0}-stable', steps.get_version.outputs.version) }}
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists. Skipping."
            else
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$TAG"
              git push origin "$TAG"
            fi
            
        - name: Create GitHub Stable Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ format('{0}-stable', steps.get_version.outputs.version) }}
            name: ${{ format('{0}-stable', steps.get_version.outputs.version) }}
            files: build/distributions/*.zip
            body: ${{ steps.extract-notes.outputs.release_notes }}
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Publish to Jetbrains Plugin Marketplace
          env:
            PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          run: ./gradlew publishPlugin

  beta-release:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    
    steps:
      - name: Create Git tag  (only if not existing)
        run: |
          tag_name: ${{ format('{0}-beta', steps.get_version.outputs.version) }}
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ format('{0}-beta', steps.get_version.outputs.version) }}
          name: ${{ format('{0}-beta', steps.get_version.outputs.version) }}
          files: build/distributions/*.zip
          body: ${{ steps.extract-notes.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

