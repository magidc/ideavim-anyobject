name: Gradle Build & Auto Release

on:
  push:
    branches:
      - release
      - beta

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout with full history so we can tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setting up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Extract Gradle version
        id: get_version
        run: |
          VERSION=$(./gradlew properties -q | grep "^pluginVersion:" | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT 

      - name: Build with Gradle
        run: ./gradlew buildPlugin

      - name: Extract release notes
        id: extract-notes
        run: |
          # Find the first version header and extract until the next version header
          RELEASE_NOTES=$(awk '/^## [0-9]/ {if(found) exit; found=1; next} found' CHANGELOG.md)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set release suffix based on branch
        id: release_suffix
        run: |
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "release" ]]; then
            RELEASE_SUFFIX="stable"
          elif [[ "$BRANCH" == "beta" ]]; then
            RELEASEO_SUFFIX="beta"
          else
            RELEASE_SUFFIX="${BRANCH}"
          fi
          echo "suffix=${RELEASE_SUFFIX}" >> $GITHUB_OUTPUT

      - name: Create Git tag (only if not existing)
        run: |
          tag_name: ${{ format('v{0}-{1}', steps.get_version.outputs.version, steps.release_suffix.outputs.suffix) }}
          echo "TAG_NAME=${tag_name}" >> $GITHUB_ENV
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          files: build/distributions/*.zip
          body: ${{ steps.extract-notes.outputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  stable-release:
      if: github.ref == 'refs/heads/release'
      runs-on: ubuntu-latest
      permissions:
        contents: write
        pull-requests: write
        checks: write

      steps:
        - name: Publish to Jetbrains Plugin Marketplace
          env:
            PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          run: ./gradlew publishPlugin


